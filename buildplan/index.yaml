# CrawlForge — Master Build Status Ledger, Dependency DAG & Phase Tracker (v2.0)
# Ledger writes are ORCHESTRATOR-ONLY (AGENT-INSTRUCTIONS.md §5). Builder agents never
# edit buildplan files. Allowed fields: status, assigned_agent, started_at, completed_at,
# blocker_reason, blocked_at, status_summary counts, phase status, and criterion status.
#
# v2.0 replaces the v1.1 completion claims. v1.1 declared 43/43 workpieces and 48/48
# criteria complete while 16/24 UI surfaces were unreachable (audit-work/reports/runtime-probe-2).
# v2.0 is generated from the living architecture (v2.0, CR-001..CR-018 applied) and the
# measured capability baseline (capability-baseline.yaml). A workpiece is completed only
# when its done_when fixture-harness run and UI path walk pass — never on unit tests alone.
metadata:
  project_name: "CrawlForge"
  build_root: "E:\\Crawlforge\\app"
  architecture_root: "E:\\Crawlforge\\architecture"
  buildplan_root: "E:\\Crawlforge\\buildplan"
  version: "2.0"
  generated: "2026-11-17"
  supersedes: "v1.1 (frozen under buildplan/v1.1/, commit 281a9ae)"
  total_phases: 9              # phase-08 .. phase-16 (continues v1.1 numbering)
  total_workpieces: 56
  total_acceptance_criteria: 58
  capability_baseline: "capability-baseline.yaml"
  in_scope_capabilities: 251
  strategy: "End-to-end flows crossing engine/wiring/API/UI; contract-first parallel waves; contracts locked at end of phase-00 (v1.1) and amended only via serialized WP-<phase>-A<n> workpieces"
  operating_manual: "AGENT-INSTRUCTIONS.md"
  evidence_basis:
    - "audit-work/reports/runtime-probe-2/RUNTIME-PROBE.md (strongest; normal entry points, HEAD fc9ac0f)"
    - "audit-work/reports/hotfix-01/hotfix-01-report.md (HOTFIX-01, commit db53378)"
    - "audit-work/reports/UNDERBUILD-AUDIT.md (G01-G29)"
    - "audit-work/history/05-functionality-audit-results.md, audit-work/history/ux-api-gap-audit.md (secondary)"
  orchestration:
    mode: "centralized-ledger"
    ledger_writer: "orchestrator-only"
    agent_naming: "cf-wp-xx-yy per workpiece where slots allow; under the runtime team-member cap (8) idle builders are reused and assigned_agent records the actual teammate"
    build_isolation: "CF_AGENT_ID-scoped obj/bin via Directory.Build.props (AGENT-INSTRUCTIONS.md §10.2)"
    wave_gates: "orchestrator_gates in each phase file; canonical surface, CF_AGENT_ID unset (§5.5)"
    amendment_protocol: "serialized contract/dependency workpieces WP-<phase>-A<n> / WP-<phase>-D<n> (§11)"
    completion_rule: "in_progress -> verifying when the builder finishes; completed only after done_when (fixture acceptance harness + UI path walk) passes, run by the orchestrator after the phase's serial wiring workpiece (AGENT-INSTRUCTIONS.md §5.6)"
    discovery_protocol: "builders stop the affected item and raise a discovery per audit-work/SOURCE-OF-TRUTH-LOOP.md §8; never edit architecture or buildplan files"

