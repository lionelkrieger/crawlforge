# CrawlForge Build Plan — Phase 01: Persistence & Storage (Parallel Wave)
# Four agents build providers, migrations, and repositories simultaneously against Phase 00 contracts.
phase_id: "phase-01"
name: "Persistence and Storage"
status: "in_progress"
depends_on_phases: ["phase-00"]
max_parallel_agents: 4
parallel_waves:
  - wave_id: "wave-1A"
    workpiece_ids: ["WP-01-01", "WP-01-02", "WP-01-03", "WP-01-04"]
gated_acceptance_criteria: [9, 15, 18]

# v1.1 orchestrator wave gates: run after EVERY wave completes, canonical build surface
# (CF_AGENT_ID unset). A failed gate blocks the next wave (AGENT-INSTRUCTIONS.md §5.5).
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"

workpieces:
