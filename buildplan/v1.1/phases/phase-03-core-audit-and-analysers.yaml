    deliverables:
      - "8-step Audit Pipeline orchestrator (§7.2) consuming stored artifacts only — never re-fetching for re-audit; rule host invoking IAuditRuleAnalyzer implementations with per-rule failure isolation"
      - "Tolerant DOM parser and Element Extraction Inventory (§7.3): url_elements groups incl. additive content_scope, llms_structure, consent_state, datalayer_snapshot, serp_metrics, header_directives"
      - "Rule taxonomy + finding model (§7.4–§7.5): rule keys, categories, severities, evidence JSON, recommendation keys; suppression-aware emission contract"
      - "Content Area Scoping: Scoped Visible Text Tree from Include/Exclude CSS+XPath selectors, content_scope_profiles persistence, invalid selectors rejected at configuration, scope-preview tool contract; unconfigured project reproduces baseline exactly (criterion #37)"
      - "Single-page analysis (§7.7) returning findings without creating a crawl project (criterion #10); scoped-text propagation contract so all content metrics operate on scoped text while head facts and link discovery stay unchanged"
    interfaces_implemented:
      - "IAuditPipeline"
      - "ITolerantDomParser"
      - "IElementInventoryExtractor"
      - "IContentScopeResolver"
      - "ISinglePageAnalyzer"
    verification_commands:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Audit.Tests --filter FullyQualifiedName~Pipeline"
    acceptance_criteria_refs: [10, 37]

