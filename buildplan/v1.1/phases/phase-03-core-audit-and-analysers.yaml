# CrawlForge Build Plan — Phase 03: Core Audit & Analysers (Parallel Wave)
# Wave 3A: six agents on disjoint analyser folders. Wave 3B: custom extraction/search/JS + scoring integrate against the pipeline contract.
phase_id: "phase-03"
name: "Core Audit and Analysers"
status: "completed"
depends_on_phases: ["phase-00", "phase-01", "phase-02"]
max_parallel_agents: 6
parallel_waves:
  - wave_id: "wave-3A"
    workpiece_ids: ["WP-03-01", "WP-03-02", "WP-03-03", "WP-03-04", "WP-03-05", "WP-03-06"]
  - wave_id: "wave-3B"
    workpiece_ids: ["WP-03-07", "WP-03-08"]
gated_acceptance_criteria: [10, 13, 24, 25, 26, 27, 28, 29, 30, 31, 32, 37, 48]

# v1.1 orchestrator wave gates: run after EVERY wave completes, canonical build surface
# (CF_AGENT_ID unset). A failed gate blocks the next wave (AGENT-INSTRUCTIONS.md §5.5).
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"

workpieces:
