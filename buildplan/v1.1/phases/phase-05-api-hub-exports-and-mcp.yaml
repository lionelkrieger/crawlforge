# CrawlForge Build Plan — Phase 05: API Hub, Exports & MCP (Parallel Wave)
# Four agents expose the completed engine surface; all bind loopback only.
phase_id: "phase-05"
name: "API Hub, Exports and MCP"
status: "completed"
depends_on_phases: ["phase-00", "phase-01", "phase-02", "phase-03", "phase-04"]
max_parallel_agents: 4
parallel_waves:
  - wave_id: "wave-5A"
    workpiece_ids: ["WP-05-01", "WP-05-02", "WP-05-03", "WP-05-04"]
gated_acceptance_criteria: [7, 8, 14, 16, 20, 23, 41]

# v1.1 orchestrator wave gates: run after EVERY wave completes, canonical build surface
# (CF_AGENT_ID unset). A failed gate blocks the next wave (AGENT-INSTRUCTIONS.md §5.5).
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"

