# CrawlForge Build Plan v2.0 — Phase 08: Hotfix Record and Foundations
# Records the two shipped hotfixes as completed workpieces, then builds the two harnesses
# that make every later workpiece verifiable: cross-layer contract conformance and the
# automated fixture acceptance harness (fixture site + normal entry points + UI path walk).
phase_id: "phase-08"
name: "Hotfix Record and Foundations"
status: "in_progress"
depends_on_phases: []
max_parallel_agents: 2
parallel_waves:
  - wave_id: "wave-8A"      # historical records; no new code
    workpiece_ids: ["WP-08-01", "WP-08-02"]
  - wave_id: "wave-8B"
    workpiece_ids: ["WP-08-03", "WP-08-04"]
  - wave_id: "wave-8C"      # serial shared wiring
    workpiece_ids: ["WP-08-05"]
gated_acceptance_criteria: []

orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host -c Debug"   # launch-crawlforge.ps1 step 2; pinned SDK 10.0.404 via app/global.json (HOTFIX-01b)
    - "cd E:\\Crawlforge\\app\\src\\frontend && npm run build"                     # launch-crawlforge.ps1 step 3
    - "cd E:\\Crawlforge\\app\\src\\electron && npx tsc -p tsconfig.build.json"    # launch-crawlforge.ps1 step 4
    - "dotnet test E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
    - "python E:\\Crawlforge\\audit-work\\register\\check_traceability.py"
    - "python E:\\Crawlforge\\audit-work\\register\\check_buildplan.py"
  after_waves:
    wave-8C:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.ContractConformance.Tests --filter KnownGap!=WP-09-06"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode http --traps noindex,canonical-conflict,soft-404-server,missing-alt"

