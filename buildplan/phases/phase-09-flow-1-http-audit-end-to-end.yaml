# CrawlForge Build Plan v2.0 — Phase 09: Flow 1 — HTTP Audit End to End
# Proves: a user creates a project, edits a configuration, starts an HTTP audit from the UI,
# watches it run with real counters, and reads real findings in the report window — with the
# HTTP fixture traps passing (criterion #49, #55, #56).
# Ownership rule for this phase: Host/Execution/, Host/Composition/, Audit/Pipeline/ and the
# frontend shared shell (App.tsx, store/, explorers/ shared files) are owned ONLY by the serial
# wiring workpiece WP-09-11. Wave-9A/9B builders deliver components + component tests; their
# done_when fixture runs execute at the phase gate after wiring (AGENT-INSTRUCTIONS.md §5.6).
phase_id: "phase-09"
name: "Flow 1 — HTTP Audit End to End"
status: "pending"
depends_on_phases: ["phase-08"]
max_parallel_agents: 5
parallel_waves:
  - wave_id: "wave-9A"
    workpiece_ids: ["WP-09-01", "WP-09-02", "WP-09-03", "WP-09-04", "WP-09-05"]
  - wave_id: "wave-9B"
    workpiece_ids: ["WP-09-06", "WP-09-07", "WP-09-08", "WP-09-09", "WP-09-10"]
  - wave_id: "wave-9C"
    workpiece_ids: ["WP-09-11"]
gated_acceptance_criteria: [49, 55, 56]

orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host -c Debug"
    - "cd E:\\Crawlforge\\app\\src\\frontend && npm run build"
    - "cd E:\\Crawlforge\\app\\src\\electron && npx tsc -p tsconfig.build.json"
    - "dotnet test E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.ContractConformance.Tests --filter KnownGap!=WP-09-06"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
    - "python E:\\Crawlforge\\audit-work\\register\\check_traceability.py"
    - "python E:\\Crawlforge\\audit-work\\register\\check_buildplan.py"
  after_waves:
    wave-9C:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.ContractConformance.Tests"   # counter-key KnownGap test must now pass
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode http --traps redirect-chain,redirect-loop,noindex,robots-blocked,canonical-conflict,broken-links,orphan,soft-404-server,cookieless-session,crawler-trap-filter,crawler-trap-calendar,cookie-gate,structured-data-errors,missing-alt,hreflang-no-return,duplicate-titles,thin-page"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --surfaces UI-01,UI-02,UI-03,UI-04,UI-10,UI-11,UI-12,UI-13,UI-20"

