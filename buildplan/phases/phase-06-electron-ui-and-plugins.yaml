# v1.1 orchestrator wave gates: run after EVERY wave completes, canonical build surface
# (CF_AGENT_ID unset). A failed gate blocks the next wave (AGENT-INSTRUCTIONS.md §5.5).
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
    - "npm run typecheck --workspace src/frontend"
    - "npm run typecheck --workspace src/electron"

