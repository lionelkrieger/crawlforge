# CrawlForge Build Plan — Phase 06: Electron UI & Plugins (Parallel Wave)
# Wave 6A establishes the shell and store; wave 6B builds four disjoint UI surface families against locked TS contracts.
phase_id: "phase-06"
name: "Electron UI and Plugins"
status: "in_progress"
depends_on_phases: ["phase-00", "phase-05"]
max_parallel_agents: 4
parallel_waves:
  - wave_id: "wave-6A"
    workpiece_ids: ["WP-06-01", "WP-06-02"]
  - wave_id: "wave-6B"
    workpiece_ids: ["WP-06-03", "WP-06-04", "WP-06-05", "WP-06-06"]
