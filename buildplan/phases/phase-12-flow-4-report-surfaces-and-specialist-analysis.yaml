# CrawlForge Build Plan v2.0 — Phase 12: Flow 4 — Report Surfaces and Specialist Analysis
# Proves: every remaining report surface renders real fixture-audit data — specialist
# explorers, visualizations, comparisons, templates, segments, clients, schedules, logs,
# plugins — and the engine gaps behind them (CWV, security, graph, semantics, hub, shell).
# Shared wiring (Host/Execution/, Host/Composition/, Audit/Pipeline/, App.tsx, store/,
# explorers/specialist shared index files) owned only by WP-12-16.
phase_id: "phase-12"
name: "Flow 4 — Report Surfaces and Specialist Analysis"
status: "pending"
depends_on_phases: ["phase-08", "phase-09", "phase-10", "phase-11"]
max_parallel_agents: 7
parallel_waves:
  - wave_id: "wave-12A"
    workpiece_ids: ["WP-12-01", "WP-12-03", "WP-12-04", "WP-12-05", "WP-12-06", "WP-12-11", "WP-12-12"]
  - wave_id: "wave-12B"
    workpiece_ids: ["WP-12-02", "WP-12-07", "WP-12-08", "WP-12-09", "WP-12-10", "WP-12-13", "WP-12-14", "WP-12-15"]
  - wave_id: "wave-12C"
    workpiece_ids: ["WP-12-16"]
gated_acceptance_criteria: []

orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host -c Debug"
    - "cd E:\\Crawlforge\\app\\src\\frontend && npm run build"
    - "cd E:\\Crawlforge\\app\\src\\electron && npx tsc -p tsconfig.build.json"
    - "dotnet test E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.ContractConformance.Tests"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
    - "python E:\\Crawlforge\\audit-work\\register\\check_traceability.py"
    - "python E:\\Crawlforge\\audit-work\\register\\check_buildplan.py"
  after_waves:
    wave-12C:
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode dual --traps noindex,duplicate-titles,thin-page,missing-alt,orphan,broken-links,structured-data-errors,consent-banner,script-injected-content"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --surfaces UI-05,UI-06,UI-07,UI-08,UI-09,UI-14,UI-15,UI-16,UI-17,UI-19,UI-21,UI-22,UI-23,UI-24"
