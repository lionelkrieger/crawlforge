# CrawlForge Build Plan — Phase 04: Advanced Intelligence (Parallel Wave)
# Five agents on disjoint intelligence modules; all additive passes over the same stored dataset.
phase_id: "phase-04"
name: "Advanced Intelligence"
status: "completed"
depends_on_phases: ["phase-00", "phase-01", "phase-02", "phase-03"]
max_parallel_agents: 5
parallel_waves:
  - wave_id: "wave-4A"
    workpiece_ids: ["WP-04-01", "WP-04-02", "WP-04-03", "WP-04-04", "WP-04-05"]
gated_acceptance_criteria: [38, 44, 45, 46, 47]

# v1.1 orchestrator wave gates: run after EVERY wave completes, canonical build surface
# (CF_AGENT_ID unset). A failed gate blocks the next wave (AGENT-INSTRUCTIONS.md §5.5).
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"

