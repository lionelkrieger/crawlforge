      - "IStopWordFilter"
    verification_commands:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Intelligence.Tests --filter FullyQualifiedName~NGrams"
    acceptance_criteria_refs: [38]

