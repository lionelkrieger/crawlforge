    phase_id: "phase-02"
    status: "completed"
    assigned_agent: "cf-wp-00-02"
    started_at: "2026-11-14T09:46:34Z"
    completed_at: "2026-11-14T10:43:03Z"
    parallel_group: "wave-2A"
    depends_on_workpieces: ["WP-00-02", "WP-01-03"]
    context_files:
