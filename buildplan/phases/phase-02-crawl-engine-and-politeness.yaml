# CrawlForge Build Plan — Phase 02: Crawl Engine & Politeness (Parallel Wave)
# Wave 2A: five agents on disjoint crawler subsystems. Wave 2B: rendering/proxy + scheduler integrate against 2A contracts.
phase_id: "phase-02"
name: "Crawl Engine and Politeness"
status: "completed"
depends_on_phases: ["phase-00", "phase-01"]
max_parallel_agents: 5
parallel_waves:
  - wave_id: "wave-2A"
    workpiece_ids: ["WP-02-01", "WP-02-02", "WP-02-03", "WP-02-04", "WP-02-05"]
  - wave_id: "wave-2B"
    workpiece_ids: ["WP-02-06", "WP-02-07"]
gated_acceptance_criteria: [3, 4, 6, 11, 12, 22, 34, 35, 36, 43]

# v1.1 orchestrator wave gates: run after EVERY wave completes, canonical build surface
# (CF_AGENT_ID unset). A failed gate blocks the next wave (AGENT-INSTRUCTIONS.md §5.5).
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"

workpieces:
