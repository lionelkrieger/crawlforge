      - "E:\\Crawlforge\\app\\tests\\CrawlForge.Crawler.Tests\\Limits\\"
    deliverables:
      - "Unlimited Limits Resolver: priority order per-audit override → project default → application default → built-in profile; fresh audit with no overrides runs unlimited total/per-domain ceilings (criterion #4); all validation invariants"
      - "robots.txt parser + cache, crawl-delay honoring, and virtual robots override (behavior per spec without altering limits resolution)"
      - "AIMD controller: R0 initial rate, additive increase α on consecutive healthy responses below TTFB threshold up to the resolved ceiling (never above; robots crawl-delay always honored); multiplicative decrease ×β to floor on TTFB spike > κ × rolling EWMA baseline, WAF soft-block, or HTTP 429/503"
      - "Per-host controller state checkpointing into crawl_checkpoints additive payload; pause/resume preserves state; disable toggle reverts exactly to static parent politeness (criterion #36)"
      - "host_throttle_events bounded history persistence; host-throttle adjustment emission contract (trigger codes, rate/concurrency before/after, TTFB sample, rolling baseline) consumed by the hub in Phase 05"
    interfaces_implemented:
      - "ILimitsResolver"
      - "IRobotsTxtParser"
      - "IAimdPolitenessController"
    verification_commands:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Crawler.Tests --filter FullyQualifiedName~Limits"
    acceptance_criteria_refs: [4, 36]

