      - "E:\\Crawlforge\\app\\Directory.Build.props"
      - "E:\\Crawlforge\\app\\Directory.Packages.props"
      - "E:\\Crawlforge\\app\\package.json"
      - "E:\\Crawlforge\\app\\package-lock.json"
      - "E:\\Crawlforge\\app\\NuGet.Config"
      - "E:\\Crawlforge\\app\\tsconfig.base.json"
