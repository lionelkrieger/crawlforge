      - "E:\\Crawlforge\\app\\src\\frontend\\"
      - "E:\\Crawlforge\\app\\src\\electron\\"
      - "E:\\Crawlforge\\app\\src\\mcp-stdio-adapter\\"
      - "E:\\Crawlforge\\app\\tests\\"
    deliverables:
      - ".NET 10 solution (CrawlForge.sln) with empty project skeletons for every backend project in the workspace topology; Directory.Build.props sets net10.0, nullable, warnings-as-errors, and System.GC.Server=true / GCConcurrent=true runtime profile"
      - "Agent-scoped MSBuild outputs in Directory.Build.props (v1.1): when CF_AGENT_ID is set, BaseIntermediateOutputPath=obj\\$(CF_AGENT_ID)\\ and BaseOutputPath=bin\\$(CF_AGENT_ID)\\ (relative paths resolve per project); unset = canonical obj/bin. Enables collision-free concurrent builds/tests (AGENT-INSTRUCTIONS.md §10.2)"
      - ".gitignore covering bin/, obj/, TestResults/, node_modules/ so agent-scoped build artifacts are never committed"
      - "Skeleton-only scope (v1.1a): empty .csproj stubs for every backend project and test project in the workspace topology, all wired into CrawlForge.sln; no implementation code in subtrees owned by later workpieces (contracts, analysers, UI surfaces). Test stubs reference xunit + Microsoft.NET.Test.Sdk so dotnet test runs green with zero tests"
      - "Directory.Packages.props central package management pinning shared package versions; later workpieces add versionless PackageReference entries to their own .csproj only"
      - "npm workspaces root package.json wiring src/frontend (React + Vite), src/electron, src/mcp-stdio-adapter; tsconfig.base.json with strict mode; workspace stubs define the typecheck (tsc --noEmit, non-emitting) and test (vitest run) scripts that later verification_commands invoke"
      - "CrawlForge.Host composition root: loopback-only Kestrel binding, dynamic free-port selection, module discovery hook (IHostModule) so later phases register controllers/hub/metrics without editing shared files"
      - "Startup/shutdown lifecycle skeleton per process-model spec: graceful drain, background-service host, feature-availability defaults (all features locally enabled)"
      - "First-launch initialization path that completes with no network and opens the main hub route (criterion #1 smoke test)"
      - "Version/diagnostics surface stub exposing the active GC profile (criterion #19 verification hook)"
    interfaces_implemented:
      - "IHostModule"
      - "IBackendLifecycle"
    verification_commands:
      - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Host.Tests --filter FullyQualifiedName~Scaffold"
      - "npm install --workspaces --ignore-scripts"
    acceptance_criteria_refs: [1, 19]

