# CrawlForge Build Plan — Phase 00: Contracts & Scaffold (Synchronization Foundation)
# Locks the solution skeleton and ALL shared contracts. Every later phase codes against these stubs.
phase_id: "phase-00"
name: "Contracts and Scaffold"
status: "completed"
depends_on_phases: []
max_parallel_agents: 3
parallel_waves:
  - wave_id: "wave-0A"
    workpiece_ids: ["WP-00-01"]
  - wave_id: "wave-0B"
    workpiece_ids: ["WP-00-02", "WP-00-03", "WP-00-05"]
  - wave_id: "wave-0C"
    workpiece_ids: ["WP-00-04"]
gated_acceptance_criteria: [1, 2, 5, 17, 19, 21]

# v1.1 orchestrator wave gates (AGENT-INSTRUCTIONS.md §5.5), canonical surface (CF_AGENT_ID unset).
# The governance analyzer and frontend workspace only exist from wave-0B onward, so they are keyed per wave.
orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
  after_waves:
    wave-0B:
      - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
      - "npm run typecheck --workspace src/frontend"
    wave-0C:
      - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"

