    owned_paths:
      - "E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host\\Execution\\"
      - "E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host\\Composition\\"
      - "E:\\Crawlforge\\app\\src\\frontend\\src\\App.tsx"
