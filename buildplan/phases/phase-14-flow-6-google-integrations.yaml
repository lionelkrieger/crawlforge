    deliverables:
      - "DI/host registration for integrations, sync scheduler, boundary allowlist entries; UI-05 route and settings wiring; criterion #58 gate execution with the test double: connect, sync, audit uses, toggle off, offline fallback — recorded evidence"
    verification_commands:
      - "dotnet build E:\\Crawlforge\\app\\CrawlForge.sln"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --surfaces UI-05,UI-21"
    done_when: "Criterion #58 passes end to end against the test double through the UI: connection created, data synced and used in a fixture audit, toggles honored, offline fallback identical; with integrations off the fixture audit is unchanged and /__fixture/requests nonGet == []."
