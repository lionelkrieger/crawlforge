# CrawlForge Build Plan v2.0 — Phase 10: Flow 2 — Rendering and Capture Modes
# Proves: JS-rendered crawling through direct CDP with the pinned bundled browser, capture
# modes (non-JS/JS/dual/adaptive) selectable in the configuration editor, rendered documents
# in full audits, and raw-vs-rendered comparison (criteria #50, #51, #52).
# Shared wiring (Host/Execution/, Host/Composition/, Audit/Pipeline/, frontend shell) is owned
# only by WP-10-04. Rendering pool internals are owned by WP-10-01; the audit-engine integration
# of rendered documents is delivered by WP-10-02 against the pool contract and connected in wiring.
phase_id: "phase-10"
name: "Flow 2 — Rendering and Capture Modes"
status: "pending"
depends_on_phases: ["phase-08", "phase-09"]
max_parallel_agents: 3
parallel_waves:
  - wave_id: "wave-10A0"
    workpiece_ids: ["WP-10-A1"]   # contract amendment, runs alone (AGENT-INSTRUCTIONS §11)
  - wave_id: "wave-10A"
    workpiece_ids: ["WP-10-01", "WP-10-02", "WP-10-05"]
  - wave_id: "wave-10B"
    workpiece_ids: ["WP-10-03"]
  - wave_id: "wave-10C"
    workpiece_ids: ["WP-10-04"]
gated_acceptance_criteria: [50, 51, 52]

orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host -c Debug"
    - "cd E:\\Crawlforge\\app\\src\\frontend && npm run build"
    - "cd E:\\Crawlforge\\app\\src\\electron && npx tsc -p tsconfig.build.json"
    - "dotnet test E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.ContractConformance.Tests"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
    - "python E:\\Crawlforge\\audit-work\\register\\check_traceability.py"
    - "python E:\\Crawlforge\\audit-work\\register\\check_buildplan.py"
  after_waves:
    wave-10C:
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode js --traps js-only-link,script-injected-content,soft-404-client-route,service-worker"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode dual --traps late-meta-change,script-injected-content"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode adaptive --traps js-only-link,late-meta-change"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --surfaces UI-04,UI-10,UI-13,UI-16,UI-19"

