    phase_id: "phase-11"
    status: "pending"
    parallel_group: "wave-11A"
    depends_on_workpieces: ["WP-10-04"]
    context_files:
      - "E:\\Crawlforge\\architecture\\03-crawl-engine\\03-rendering-and-proxy-routing.md"
    architecture_sections:
      - file: "E:\\Crawlforge\\architecture\\03-crawl-engine\\03-rendering-and-proxy-routing.md"
        sections: ["5.6.4"]
    capabilities:
      - { id: "CAP-A-X17", baseline_state: "missing_engine" }
    ui_surfaces: ["UI-04", "UI-13", "UI-16"]
    fixture_traps: ["click-only-navigation", "never-place-bet"]
    contract_tests:
      - payload: "discovered-by-click URL rows (discovery source click) + non-crawlable navigation inventory rows"
        test: "ClickDiscoveryConformanceTests"
      - payload: "safety gate: no non-GET/HEAD request triggered by click discovery; destructive-action controls never activated"
        test: "ClickSafetyConformanceTests — asserts GET /__fixture/requests nonGet == [] and no Place bet/Deposit/Logout activation"
    reopens:
      - workpiece_id: "WP-02-06"
        evidence: "probe-2: click-only-navigation not_testable; no click discovery exists (D-016/CR-009 §5.6.4)"
    owned_paths:
      - "E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Crawler\\Rendering\\ClickDiscovery\\"
      - "E:\\Crawlforge\\app\\tests\\CrawlForge.Crawler.Tests\\ClickDiscovery\\"
    deliverables:
      - "Click discovery (opt-in per configuration): click-only SPA navigation discovered as 'discovered by click' (/spa/markets, /spa/promotions, /spa/results); without it, the same controls reported as non-crawlable navigation"
      - "Safety rules enforced: only GET/HEAD-producing controls clicked; destructive-action patterns (Place bet, Deposit, Logout, buy/delete/pay) never triggered; no form filling; per-page click budget; every skipped control inventoried with reason"
    verification_commands:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Crawler.Tests --filter FullyQualifiedName~ClickDiscovery"
    done_when: "Phase-gate fixture run (js, click discovery on): click-only-navigation passes (three routes discovered by click); never-place-bet passes (nonGet == [] after the audit, no bet/deposit/logout control triggered); with click discovery off the controls appear in the non-crawlable navigation inventory."
    acceptance_criteria_refs: [54]

