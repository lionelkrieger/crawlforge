# CrawlForge Build Plan v2.0 — Phase 11: Flow 3 — Site Types, SPA and Crawl Safety
# Proves: site-type rules (hash routes, client-side redirects, postbacks, ViewState, rendered
# soft-404), click discovery with its safety rules (never Place bet / Deposit / Logout),
# consent-state rendering, and the websocket-tolerant wait rule (criteria #53, #54).
# Shared wiring owned only by WP-11-05.
phase_id: "phase-11"
name: "Flow 3 — Site Types, SPA and Crawl Safety"
status: "pending"
depends_on_phases: ["phase-08", "phase-09", "phase-10"]
max_parallel_agents: 3
parallel_waves:
  - wave_id: "wave-11A"
    workpiece_ids: ["WP-11-01", "WP-11-02", "WP-11-03"]
  - wave_id: "wave-11B"
    workpiece_ids: ["WP-11-04"]
  - wave_id: "wave-11C"
    workpiece_ids: ["WP-11-05"]
gated_acceptance_criteria: [53, 54]

orchestrator_gates:
  after_each_wave:
    - "dotnet build E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Host -c Debug"
    - "cd E:\\Crawlforge\\app\\src\\frontend && npm run build"
    - "cd E:\\Crawlforge\\app\\src\\electron && npx tsc -p tsconfig.build.json"
    - "dotnet test E:\\Crawlforge\\app\\CrawlForge.sln"
    - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.ContractConformance.Tests"
    - "dotnet run --project E:\\Crawlforge\\app\\tools\\governance-analyzer -- --root E:\\Crawlforge\\app\\src --fail-on-violation"
    - "python E:\\Crawlforge\\audit-work\\register\\check_traceability.py"
    - "python E:\\Crawlforge\\audit-work\\register\\check_buildplan.py"
  after_waves:
    wave-11C:
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --mode js --traps soft-404-client-route,hash-route,client-side-redirect,postback-links,cookieless-session,large-viewstate,live-websocket,click-only-navigation,never-place-bet,consent-banner,service-worker"
      - "python E:\\Crawlforge\\app\\tests\\fixture-acceptance\\run_fixture_acceptance.py --surfaces UI-04,UI-10,UI-12,UI-13,UI-16"

workpieces:
  - workpiece_id: "WP-11-01"
    title: "Site-Type Rules — Hash Routes, Client Redirects, Postbacks, ViewState, Rendered Soft-404"
    phase_id: "phase-11"
    status: "pending"
    parallel_group: "wave-11A"
    depends_on_workpieces: ["WP-10-04"]
    context_files:
      - "E:\\Crawlforge\\architecture\\04-audit-and-analysis-engine\\02-core-seo-and-indexability-rules.md"
      - "E:\\Crawlforge\\architecture\\03-crawl-engine\\02-frontier-fetching-and-waf.md"
    architecture_sections:
      - file: "E:\\Crawlforge\\architecture\\04-audit-and-analysis-engine\\02-core-seo-and-indexability-rules.md"
        sections: ["7.19", "7.12"]
      - file: "E:\\Crawlforge\\architecture\\03-crawl-engine\\02-frontier-fetching-and-waf.md"
        sections: ["5.2"]
    capabilities:
      - { id: "CAP-B-X03", baseline_state: "partial" }
      - { id: "CAP-B-X05", baseline_state: "missing_engine" }
      - { id: "CAP-A-X15", baseline_state: "missing_engine" }
      - { id: "CAP-A-X16", baseline_state: "missing_engine" }
      - { id: "CAP-C-X05", baseline_state: "missing_engine" }
    ui_surfaces: ["UI-12", "UI-13", "UI-16"]
    fixture_traps: ["soft-404-client-route", "hash-route", "client-side-redirect", "postback-links", "large-viewstate", "cookieless-session"]
    contract_tests:
      - payload: "site-type findings: spa.hash-route, redirect.client-side, navigation.postback, performance.viewstate-weight, content.soft-404 (rendered)"
        test: "SiteTypeFindingConformanceTests"
      - payload: "hash-route capture: distinct routes (#/products, #!/about) as separate route rows"
        test: "HashRouteCaptureConformanceTests"
    reopens:
      - workpiece_id: "WP-03-02"
        evidence: "probe-2: hash-route/client-side-redirect/postback-links/large-viewstate/soft-404-client-route all fail or not_testable; no site-type analysis exists (CR-009 §7.19)"
    owned_paths:
      - "E:\\Crawlforge\\app\\src\\backend\\CrawlForge.Audit\\Indexability\\SiteTypes\\"
      - "E:\\Crawlforge\\app\\tests\\CrawlForge.Audit.Tests\\SiteTypes\\"
    deliverables:
      - "Hash-route handling: #/ and #!/ routing detected and reported; with hash-route mode on, both fixture routes captured as distinct routes"
      - "Client-side redirect detection: meta-refresh and JS location changes (300 ms fixture redirect) recorded as client-side redirects with target evidence"
      - "Postback navigation detection: __doPostBack/ViewState postback links recorded as uncrawlable navigation, never followed"
      - "ViewState weight measurement: __VIEWSTATE ~150 KB reported above the 100 KB threshold"
      - "Rendered soft-404: SPA shell returning 200 but rendering 'Page not found' reported as soft 404 from the rendered document, distinct from server soft-404"
    verification_commands:
      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Audit.Tests --filter FullyQualifiedName~SiteTypes"
    done_when: "Phase-gate fixture run (js): soft-404-client-route, hash-route, client-side-redirect, postback-links, large-viewstate pass per expected-results.json; cookieless-session remains pass from flow 1; UI walk: UI-12 shows each site-type finding with evidence."
    acceptance_criteria_refs: [53]

