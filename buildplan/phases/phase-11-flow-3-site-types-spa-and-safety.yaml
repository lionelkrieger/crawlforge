      - "dotnet test E:\\Crawlforge\\app\\tests\\CrawlForge.Intelligence.Tests --filter FullyQualifiedName~Consent"
    done_when: "Phase-gate fixture run (js): live-websocket passes (settles, no 20 s cap); consent-banner passes (tag hit with consent=none before interaction, reported); UI walk: UI-04 Consent-states tab selects states and the finding appears in UI-16 Analytics and tagging."
    acceptance_criteria_refs: [50, 54]

